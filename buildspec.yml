version: 0.2

env:
  variables:
    PROJECT_FILE: aws-dotnetcore-webapp.csproj
    BUILD_CONFIGURATION: Release
    PUBLISH_DIR: publish

phases:
  install:
    commands:
      - echo Installing .NET 10 SDK...
      - wget https://dot.net/v1/dotnet-install.sh
      - chmod +x dotnet-install.sh
      - ./dotnet-install.sh --channel 10.0
      - export PATH="$PATH:$HOME/.dotnet"
      - dotnet --info

  pre_build:
    commands:
      - export PATH="$PATH:$HOME/.dotnet"
      - dotnet restore "$PROJECT_FILE"

  build:
    commands:
      - export PATH="$PATH:$HOME/.dotnet"
      - echo Building project...
      - dotnet build "$PROJECT_FILE" -c "$BUILD_CONFIGURATION" --no-restore
      - echo Publishing app...
      - dotnet publish "$PROJECT_FILE" -c "$BUILD_CONFIGURATION" -o "$PUBLISH_DIR/web" --no-build

  post_build:
    commands:
      - echo Creating deployment bundle for CodeDeploy...
      - cp appspec.yml "$PUBLISH_DIR"/appspec.yml
      - cp stop_iis.ps1 backup_wwwroot.ps1 download_deployment_files.ps1 deploy_files.ps1 start_iis.ps1 "$PUBLISH_DIR"/
      - cd "$PUBLISH_DIR"
      - zip -r ../deploy.zip .

artifacts:
  files:
    - deploy.zip
  discard-paths: yes

cache:
  paths:
    - /root/.nuget/packages/**/*
