version: 0.2

env:
  variables:
    PROJECT_FILE: aws-dotnetcore-webapp.csproj
    BUILD_CONFIGURATION: Release
    PUBLISH_DIR: publish

phases:
  install:
    runtime-versions:
      dotnet: 10
    commands:
      - echo Installing dependencies...

  pre_build:
    commands:
      - echo Restoring NuGet packages...
      - dotnet restore "$PROJECT_FILE"

  build:
    commands:
      - echo Building project...
      - dotnet build "$PROJECT_FILE" -c "$BUILD_CONFIGURATION" --no-restore
      - echo Publishing app...
      - dotnet publish "$PROJECT_FILE" -c "$BUILD_CONFIGURATION" -o "$PUBLISH_DIR" --no-build

  post_build:
    commands:
      - echo Creating deployment bundle for Elastic Beanstalk...
      - cd "$PUBLISH_DIR"
      - zip -r ../deploy.zip .

artifacts:
  files:
    - deploy.zip
  discard-paths: yes

cache:
  paths:
    - /root/.nuget/packages/**/*
